title: quiet-wins
description: Building in public my journey as a software developer.
tagline: slow, steady, shared
lang: en
url: https://quiet-wins.com
# Empty because the site is served from the domain root.
baseurl: ""

author:
  name: Camilo Villegas
  email: camilovillegas265@gmail.com
  github: be-world
  linkedin: camilovj

plugins:
  - jekyll-feed

sass:
  style: compressed
  sourcemap: never
  sass_dir: _sass

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - vendor
  - .bundle
  - Gemfile
  - Gemfile.lock
