---
layout: default
---

<article class="post">
  <header class="post__header">
    <h1 class="post__title">{{ page.title | escape }}</h1>
    <p class="post__meta">
      <time datetime="{{ page.date | date: '%Y-%m-%d' }}">
        {{ page.date | date: "%B %-d, %Y" }}
      </time>
    </p>
  </header>

  <div class="post__content">
    {{ content }}
  </div>

  {% if page.previous or page.next %}
    <nav class="post-pager" aria-label="More posts">
      {% if page.previous %}
        <a class="post-pager__newer" rel="prev" href="{{ page.previous.url | relative_url }}">
          <span class="post-pager__label">Newer</span>
          <span class="post-pager__title">{{ page.previous.title | escape }}</span>
        </a>
      {% endif %}
      {% if page.next %}
        <a class="post-pager__older" rel="next" href="{{ page.next.url | relative_url }}">
          <span class="post-pager__label">Older</span>
          <span class="post-pager__title">{{ page.next.title | escape }}</span>
        </a>
      {% endif %}
    </nav>
  {% endif %}
</article>
