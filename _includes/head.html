<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f2e57">
  {% assign page_description = page.description | default: site.description %}
  {% if page.url == "/" %}
    <title>{{ site.title | escape }}</title>
  {% elsif page.title %}
    <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
  {% else %}
    <title>{{ site.title | escape }}</title>
  {% endif %}
  <meta name="description" content="{{ page_description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | absolute_url }}">
  {% if page.date %}
    <meta property="og:type" content="article">
  {% else %}
    <meta property="og:type" content="website">
  {% endif %}
  <meta property="og:title" content="{% if page.title and page.url != '/' %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
  <meta property="og:description" content="{{ page_description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
</head>
