<ul class="social-links">
  {% if site.author.github %}
  <li>
    <a
      class="social-links__link"
      href="https://github.com/{{ site.author.github }}"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="{{ site.author.name | escape }} on GitHub"
    >
      <svg
        class="social-links__icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
        focusable="false"
      >
        <path
          fill="currentColor"
          d="M12 .5A11.5 11.5 0 0 0 .5 12.3c0 5.2 3.4 9.6 8.1 11.2.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.6-1.4-1.4-1.8-1.4-1.8-1.1-.8.1-.7.1-.7 1.2.1 1.9 1.3 1.9 1.3 1.1 1.9 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.4-5.5-6.1 0-1.3.5-2.4 1.2-3.3-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.3a11.4 11.4 0 0 1 6 0c2.3-1.6 3.3-1.3 3.3-1.3.6 1.7.2 2.9.1 3.2.8.9 1.2 2 1.2 3.3 0 4.7-2.8 5.8-5.5 6.1.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A11.5 11.5 0 0 0 23.5 12.3 11.5 11.5 0 0 0 12 .5z"
        />
      </svg>
    </a>
  </li>
  {% endif %} {% if site.author.linkedin %}
  <li>
    <a
      class="social-links__link"
      href="https://www.linkedin.com/in/{{ site.author.linkedin }}"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="{{ site.author.name | escape }} on LinkedIn"
    >
      <svg
        class="social-links__icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
        focusable="false"
      >
        <path
          fill="currentColor"
          d="M4.7 3.4A2.2 2.2 0 1 1 2.5 1.2a2.2 2.2 0 0 1 2.2 2.2zM2.4 8.3H6.6V22H2.4V8.3zM9.1 8.3h4v1.9h.1c.6-1.1 2-2.2 4.1-2.2 4.4 0 5.2 2.9 5.2 6.6V22h-4.2v-6.8c0-1.6 0-3.7-2.3-3.7s-2.6 1.8-2.6 3.6V22H9.1V8.3z"
        />
      </svg>
    </a>
  </li>
  {% endif %} {% if site.author.email %}
  <li>
    <a
      class="social-links__link"
      href="mailto:{{ site.author.email }}"
      aria-label="Email {{ site.author.name | escape }}"
    >
      <svg
        class="social-links__icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
        focusable="false"
      >
        <path
          fill="currentColor"
          d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"
        />
      </svg>
    </a>
  </li>
  {% endif %}
</ul>
